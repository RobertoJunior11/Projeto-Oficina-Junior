<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Oficina de Veículos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>🚗 Oficina de Veículos</h1>
    </header>

    <!-- Navegação por abas -->
    <nav class="tabs">
      <button class="tab-button active" onclick="showTab('proprietarios')">👥 Proprietários</button>
      <button class="tab-button" onclick="showTab('veiculos')">🚗 Veículos</button>
    </nav>

    <!-- Aba Veículos -->
    <div id="veiculos" class="tab-content">
      <section>
        <h2>Cadastrar / Editar Veículo</h2>

        <form id="veiculoForm">
          <input type="hidden" id="veiculoId" />

          <label for="veiculo">
            Nome do Veículo:
            <input type="text" id="veiculo" placeholder="Ex: Fusca" required />
          </label>

          <label for="marca">
            Marca:
            <input type="text" id="marca" placeholder="Ex: Volkswagen" required />
          </label>

          <label for="ano">
            Ano:
            <input type="number" id="ano" min="1900" max="2099" placeholder="Ex: 2025" required />
          </label>

          <label for="proprietarioVeiculo">
            Proprietário:
            <select id="proprietarioVeiculo" required>
              <option value="">Selecione um proprietário</option>
            </select>
          </label>

          <button type="submit">Salvar Veículo</button>
        </form>
      </section>

      <section>
        <h2>Veículos Cadastrados</h2>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Veículo</th>
              <th>Marca</th>
              <th>Ano</th>
              <th>Proprietário</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaVeiculos"></tbody>
        </table>

        <div id="paginacaoVeiculos">
          <button id="anteriorVeiculos">⬅ Anterior</button>
          <span id="paginaAtualVeiculos">1</span>
          <button id="proximoVeiculos">Próximo ➡</button>
        </div>
      </section>
    </div>

    <!-- Aba Proprietários -->
    <div id="proprietarios" class="tab-content active">
      <section>
        <h2>Cadastrar / Editar Proprietário</h2>

        <form id="proprietarioForm">
          <input type="hidden" id="proprietarioId" />

          <label for="nome">
            Nome:
            <input type="text" id="nome" placeholder="Ex: João Silva" required />
          </label>

          <label for="email">
            Email:
            <input type="email" id="email" placeholder="Ex: joao@email.com" required />
          </label>

          <label for="telefone">
            Telefone:
            <input type="tel" id="telefone" placeholder="Ex: (11) 99999-9999" required />
          </label>

          <button type="submit">Salvar Proprietário</button>
        </form>
      </section>

      <section>
        <h2>Proprietários Cadastrados</h2>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Telefone</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaProprietarios"></tbody>
        </table>

        <div id="paginacaoProprietarios">
          <button id="anteriorProprietarios">⬅ Anterior</button>
          <span id="paginaAtualProprietarios">1</span>
          <button id="proximoProprietarios">Próximo ➡</button>
        </div>
      </section>
    </div>

    <script src="./js/scripts.js"></script>
  </body>
</html>
